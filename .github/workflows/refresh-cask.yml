name: Refresh cask

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Point the cask at the latest Mac release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo cvthang56th2/rewrite-better --json tagName --jq .tagName)"
          version="${tag#v}"
          dir="$(mktemp -d)"
          gh release download "$tag" --repo cvthang56th2/rewrite-better --pattern "RewriteBetter-${version}.dmg" --dir "$dir"
          node scripts/homebrew-cask.js \
            --version "$version" \
            --dmg "$dir/RewriteBetter-${version}.dmg" \
            --out Casks/rewrite-better.rb
          git add Casks/rewrite-better.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask already matches ${version}."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update Rewrite Better to ${version}"
          git push
